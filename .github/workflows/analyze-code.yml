name: Update Lines of Code in Readme

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  count-lines:
    runs-on: ubuntu-latest

    env:
      HIGHLIGHT_LANGS: "C,C/C++ Header,C++,JavaScript,TypeScript,JSX,Vuejs Component,PHP,Go,Zig,Rust,Python"
      IGNORE_LANGS: "JSON,HTML,CSS,SCSS,Sass,Markdown,SVG,XML,YAML,TOML,CSV,Text,Properties"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq cloc locales
          sudo locale-gen en_US.UTF-8

      - name: Fetch and Clone Repositories
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e

          mkdir -p public-repos

          page=1

          while true; do
            RESPONSE=$(curl -fsSL \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/repos?per_page=100&page=$page&type=owner")

            REPOS=$(echo "$RESPONSE" | jq -r '.[] | select(.fork == false) | .full_name')

            if [ -z "$REPOS" ]; then
              break
            fi

            while IFS= read -r REPO; do
              [ -z "$REPO" ] && continue

              DEFAULT_BRANCH=$(curl -fsSL \
                -H "Authorization: Bearer $GH_PAT" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO" |
                jq -r '.default_branch')

              REPO_NAME=$(basename "$REPO")

              echo "Cloning $REPO (default branch: $DEFAULT_BRANCH)..."

              git clone \
                --branch "$DEFAULT_BRANCH" \
                --single-branch \
                --depth 1 \
                "https://github.com/$REPO.git" \
                "public-repos/$REPO_NAME" || \
                echo "Failed to clone $REPO; continuing."

            done <<< "$REPOS"

            page=$((page + 1))
          done

      - name: Calculate Per-Repository Lines of Code
        run: |
          set -e

          mkdir -p output/repositories

          echo "Calculating lines of code per repository..."
          echo "Ignoring directories named: external, gen"

          for REPO_DIR in public-repos/*; do
            [ -d "$REPO_DIR" ] || continue

            REPO_NAME=$(basename "$REPO_DIR")

            echo ""
            echo "========================================"
            echo "Repository: $REPO_NAME"
            echo "========================================"

            cloc "$REPO_DIR" \
              --json \
              --report-file="output/repositories/${REPO_NAME}.json" \
              --exclude-lang="${IGNORE_LANGS}" \
              --exclude-dir="external,gen"
          done

      - name: Generate README Breakdown
        run: |
          set -e

          export LC_ALL="en_US.UTF-8"
          export LANG="en_US.UTF-8"

          format_number() {
            printf "%'d" "$1"
          }

          BREAKDOWN_FILE="readme-breakdown.txt"

          rm -f "$BREAKDOWN_FILE"

          echo '[ LINES OF CODE BY REPOSITORY ]' >> "$BREAKDOWN_FILE"
          echo "" >> "$BREAKDOWN_FILE"

          TOTAL_CODE=0
          TOTAL_FILES=0
          REPO_COUNT=0

          for REPO_FILE in output/repositories/*.json; do
            [ -f "$REPO_FILE" ] || continue

            REPO_NAME=$(basename "$REPO_FILE" .json)

            REPO_LINES=$(jq '.SUM.code // 0' "$REPO_FILE")
            REPO_FILES=$(jq '.SUM.nFiles // 0' "$REPO_FILE")

            if [ "$REPO_LINES" -eq 0 ]; then
              continue
            fi

            REPO_COUNT=$((REPO_COUNT + 1))
            TOTAL_CODE=$((TOTAL_CODE + REPO_LINES))
            TOTAL_FILES=$((TOTAL_FILES + REPO_FILES))

            echo "### $REPO_NAME" >> "$BREAKDOWN_FILE"
            echo '```text' >> "$BREAKDOWN_FILE"

            jq -r '
              to_entries
              | map(select(.key != "header" and .key != "SUM"))
              | map({
                  lang: .key,
                  lines: (.value.code // 0)
                })
              | map(select(.lines > 0))
              | sort_by(-.lines)
              | .[]
              | [.lang, .lines]
              | @tsv
            ' "$REPO_FILE" |
            while IFS=$'\t' read -r LANG_NAME LINES; do
              printf "%-20s --> %s lines\n" \
                "$LANG_NAME" \
                "$(format_number "$LINES")" >> "$BREAKDOWN_FILE"
            done

            printf "%-20s --> %s lines\n" \
              "TOTAL" \
              "$(format_number "$REPO_LINES")" >> "$BREAKDOWN_FILE"

            echo '```' >> "$BREAKDOWN_FILE"
            echo "" >> "$BREAKDOWN_FILE"
          done

          echo '[ TOTAL ]' >> "$BREAKDOWN_FILE"
          printf "%-20s --> %s\n" \
            "Repositories" \
            "$REPO_COUNT" >> "$BREAKDOWN_FILE"

          printf "%-20s --> %s\n" \
            "Source files" \
            "$(format_number "$TOTAL_FILES")" >> "$BREAKDOWN_FILE"

          printf "%-20s --> %s lines\n" \
            "Total lines of code" \
            "$(format_number "$TOTAL_CODE")" >> "$BREAKDOWN_FILE"

          CODE_BLOCK_FILE="code-block.txt"

          {
            echo '```text'
            cat "$BREAKDOWN_FILE"
            echo '```'
          } > "$CODE_BLOCK_FILE"

          if ! grep -q '<!-- LANGUAGES BREAKDOWN START -->' README.md; then
            echo "ERROR: README.md is missing LANGUAGES BREAKDOWN START marker."
            exit 1
          fi

          if ! grep -q '<!-- LANGUAGES BREAKDOWN END -->' README.md; then
            echo "ERROR: README.md is missing LANGUAGES BREAKDOWN END marker."
            exit 1
          fi

          {
            sed -n '1,/<!-- LANGUAGES BREAKDOWN START -->/p' README.md
            cat "$CODE_BLOCK_FILE"
            sed -n '/<!-- LANGUAGES BREAKDOWN END -->/,$p' README.md
          } > README.md.tmp

          mv README.md.tmp README.md

          rm -f "$BREAKDOWN_FILE" "$CODE_BLOCK_FILE"

      - name: Commit and Push Output
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add output README.md

          git commit \
            -m "chore: update README with latest code statistics" || \
            echo "No changes to commit"

          git push origin HEAD