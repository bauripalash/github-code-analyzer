name: Update Lines of Code in Readme

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  count-lines:
    runs-on: ubuntu-latest

    env:
      HIGHLIGHT_LANGS: "C,C++,C#,JavaScript,TypeScript,JSX,Vuejs Component,PHP"
      IGNORE_LANGS: "JSON,HTML,CSS,SCSS,Sass,Markdown,SVG,XML,YAML,TOML,CSV,Text,Properties"
      EXCLUDE_DIRS: "external,vendor,third_party,build,dist"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq cloc locales
          sudo locale-gen en_US.UTF-8

      - name: Fetch and Clone Repositories
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e

          mkdir -p public-repos

          page=1

          while true; do
            RESPONSE=$(curl -fsSL \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/user/repos?per_page=100&page=$page&type=owner")

            REPOS=$(echo "$RESPONSE" | jq -r '.[] | select(.fork == false) | .full_name')

            [ -z "$REPOS" ] && break

            while IFS= read -r REPO; do
              [ -z "$REPO" ] && continue

              DEFAULT_BRANCH=$(curl -fsSL \
                -H "Authorization: Bearer $GH_PAT" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO" |
                jq -r '.default_branch')

              REPO_NAME=$(basename "$REPO")

              echo "Cloning $REPO (default branch: $DEFAULT_BRANCH)..."

              git clone \
                --branch "$DEFAULT_BRANCH" \
                --single-branch \
                --depth 1 \
                "https://github.com/$REPO.git" \
                "public-repos/$REPO_NAME" ||
                echo "Failed to clone $REPO; continuing."

            done <<< "$REPOS"

            page=$((page + 1))
          done

      - name: Calculate Lines of Code
        run: |
          set -e

          mkdir -p output

          echo "Calculating lines of code..."
          echo "Excluded directories: ${EXCLUDE_DIRS}"

          cloc public-repos \
            --json \
            --report-file=output/cloc-output.json \
            --exclude-lang="${IGNORE_LANGS}" \
            --exclude-dir="${EXCLUDE_DIRS}"

      - name: Update README
        run: |
          set -e

          export LC_ALL="en_US.UTF-8"
          export LANG="en_US.UTF-8"

          format_number() {
            printf "%'d\n" "$1"
          }

          TOTAL_LINES=$(jq '.SUM.code // 0' output/cloc-output.json)

          OTHER_LINES=0
          FORMATTED_BREAKDOWN=""

          HL=",$(echo "$HIGHLIGHT_LANGS" | tr -d ' '),"

          while read -r entry; do
            LANG_NAME=$(echo "$entry" | jq -r '.lang')
            LINES=$(echo "$entry" | jq -r '.lines')

            if [[ "$HL" == *",$LANG_NAME,"* ]]; then
              FORMATTED=$(format_number "$LINES")
              FORMATTED_BREAKDOWN+=$(printf "%-12s --> %s lines\n" "$LANG_NAME" "$FORMATTED")$'\n'
            else
              OTHER_LINES=$((OTHER_LINES + LINES))
            fi
          done < <(
            jq -c '
              to_entries
              | map(select(.key != "header" and .key != "SUM"))
              | map({lang: .key, lines: .value.code})
              | map(select(.lines > 0))
              | .[]
            ' output/cloc-output.json
          )

          if [[ $OTHER_LINES -gt 0 ]]; then
            FORMATTED_OTHER=$(format_number "$OTHER_LINES")
            FORMATTED_BREAKDOWN+=$(printf "%-12s --> %s lines\n" "Others" "$FORMATTED_OTHER")$'\n'
          fi

          FORMATTED_TOTAL=$(format_number "$TOTAL_LINES")

          CODE_BLOCK='```text
          [ LANGUAGES BREAKDOWN ]

          '"$FORMATTED_BREAKDOWN"'
          [ TOTAL LINES OF CODE: '"$FORMATTED_TOTAL"' ]
          ```'

          if ! grep -q '<!-- LANGUAGES BREAKDOWN START -->' README.md; then
            echo "ERROR: README.md is missing LANGUAGES BREAKDOWN START marker."
            exit 1
          fi

          if ! grep -q '<!-- LANGUAGES BREAKDOWN END -->' README.md; then
            echo "ERROR: README.md is missing LANGUAGES BREAKDOWN END marker."
            exit 1
          fi

          {
            sed -n '1,/<!-- LANGUAGES BREAKDOWN START -->/p' README.md
            echo "$CODE_BLOCK"
            sed -n '/<!-- LANGUAGES BREAKDOWN END -->/,$p' README.md
          } > README.md.tmp

          mv README.md.tmp README.md

      - name: Commit and Push Output
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add output/cloc-output.json README.md

          git commit \
            -m "chore: update README and cloc-output.json with latest code stats" ||
            echo "No changes to commit"

          git push origin HEAD